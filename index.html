<!DOCTYPE html>

<body>
    <header>
      <h1>전국 금연구역 조회 서비스</h1>
      <p>흡연 구역을 피하고 쾌적한 환경을 유지할 수 있으며, 특히 어린이 보호구역이나 공공장소에서의 흡연 예방 효과가 증대됩니다.</p>
    </header>

    <h2>서비스 소개</h2>
    <h3>실외 금연구역의 위치·시간·관리기관 등의 정보를 조회할 수 있는 서비스</h3>
 
    <h2>주요 기능</h2>
        <ul>
          <li>
            <h3>간편 검색 기능</h3>
            <p>금연구역을 간편하게 검색할 수 있습니다.</p>
          </li>
          <li>
            <h3>상세 검색 기능</h3>
            <p>위치, 관리기관 등 여러 항목을 선택하여 상세히 검색할 수 있습니다.</p>
          </li>
          <li>
            <h3>엑셀 저장 기능</h3>
            <p>조회한 데이터를 엑셀파일로 다운로드 할 수 있습니다.</p>
          </li>
        </ul>
  </body>

</html>
